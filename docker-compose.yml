name: ws-chat

x-cassandra-environment: &cassandra-environment
  CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-ws-chat}
  CASSANDRA_DC: ${CASSANDRA_DC:-datacenter1}
  CASSANDRA_RACK: ${CASSANDRA_RACK:-rack1}
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  CASSANDRA_SEEDS: cassandra-1
  MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:-512M}
  HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-100M}

x-cassandra-healthcheck: &cassandra-healthcheck
  test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local;'"]
  interval: 30s
  timeout: 15s
  retries: 10
  start_period: 120s

x-app-service: &app-service
  image: ws-chat-app
  build: .
  init: true
  environment:
    PORT: '3000'
    CASSANDRA_CONTACT_POINTS: cassandra-1,cassandra-2
    CASSANDRA_LOCAL_DATACENTER: ${CASSANDRA_DC:-datacenter1}
    CASSANDRA_KEYSPACE: ws_chat
    REDIS_URL: redis://redis:6379
    ELASTICSEARCH_URL: http://elasticsearch:9200
  depends_on:
    cassandra-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  expose:
    - '3000'
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  app-1:
    <<: *app-service

  app-2:
    <<: *app-service

  app-3:
    <<: *app-service

  nginx:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy

  cassandra-1:
    image: cassandra:5.0
    environment: *cassandra-environment
    ports:
      - '127.0.0.1:${CASSANDRA_PORT:-9042}:9042'
    volumes:
      - cassandra-1-data:/var/lib/cassandra
    healthcheck: *cassandra-healthcheck

  cassandra-2:
    image: cassandra:5.0
    environment: *cassandra-environment
    ports:
      - '127.0.0.1:${CASSANDRA_SECOND_PORT:-9043}:9042'
    volumes:
      - cassandra-2-data:/var/lib/cassandra
    depends_on:
      cassandra-1:
        condition: service_healthy
    healthcheck: *cassandra-healthcheck

  cassandra-init:
    image: cassandra:5.0
    environment:
      CASSANDRA_DC: ${CASSANDRA_DC:-datacenter1}
    volumes:
      - ./docker/cassandra/init-keyspace.sh:/init-keyspace.sh:ro
    entrypoint: ["sh", "/init-keyspace.sh"]
    depends_on:
      cassandra-1:
        condition: service_healthy
      cassandra-2:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.5.6}
  #   environment:
  #     discovery.type: single-node
  #     xpack.security.enabled: 'false'
  #     ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
  #   ports:
  #     - '127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200'
  #   volumes:
  #     - elasticsearch-data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 60s

volumes:
  cassandra-1-data:
  cassandra-2-data:
  redis-data:
  elasticsearch-data:
